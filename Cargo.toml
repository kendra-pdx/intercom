[package]
name = "intercom"
version = "0.1.1"
edition = "2024"
publish = ["kellnr"]

[dependencies]
async-channel = { version = "2.5", default-features = false }
async-trait = "0.1"
either = { version = "1.16", default-features = false }
itertools = { version = "0.14", default-features = false, features = [
  "use_alloc"
] }
tracing = { version = "0.1", default-features = false, features = ["attributes"] }

[dev-dependencies]
tokio = { version = "1.52", features = [
  "macros",
  "rt-multi-thread",
  "test-util",
  "time"
] }
